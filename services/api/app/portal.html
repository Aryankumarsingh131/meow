<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JalSakshi — resident portal</title>
<style>
  :root { --blue: #0b5cab; --ink: #1d2733; --muted: #5b6776; --line: #d8dee6; --bg: #f4f7fa; --warn: #8a5a00; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--blue); color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { margin: 0 0 10px; font-size: 18px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 12px 16px; background: var(--blue); color: #fff; width: 100%; margin-top: 14px; cursor: pointer; }
  button.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  button:disabled { opacity: .6; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .msg { margin-top: 10px; font-size: 14px; }
  .msg.err { color: var(--bad); }
  .note { font-size: 13px; color: var(--muted); }
  .item { border-top: 1px solid var(--line); padding: 10px 0; }
  .item:first-of-type { border-top: 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #e8eef6; color: var(--blue); }
  .pill.new { background: #fff4dc; color: var(--warn); }
  .hidden { display: none; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { margin: 0; background: #fff; color: var(--blue); border: 1px solid var(--line); }
  .tabs button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1>JalSakshi</h1>
  <p>Report a water problem and follow what happens to it.</p>
</header>
<main>
  <section id="auth">
    <div class="tabs">
      <button id="tab-in" class="on" type="button">Sign in</button>
      <button id="tab-up" type="button">Create account</button>
    </div>
    <form id="form-auth">
      <div id="up-only" class="hidden">
        <label for="name">Your name (optional)</label>
        <input id="name" autocomplete="name" maxlength="100">
        <label for="phone">Phone with country code (optional, for SMS updates)</label>
        <input id="phone" autocomplete="tel" placeholder="+919812345678" maxlength="32">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254">
      <label for="password">Password <span id="pw-hint" class="note hidden">(at least 8 characters)</span></label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="128">
      <button id="auth-submit" type="submit">Sign in</button>
      <p id="auth-msg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="report" class="hidden">
    <div class="row" style="align-items:center">
      <h2 style="margin:0">Report a problem</h2>
      <button id="sign-out" class="ghost" type="button" style="margin:0;flex:0 0 auto;width:auto">Sign out</button>
    </div>
    <p id="who" class="note"></p>
    <form id="form-report">
      <label for="ctype">What is wrong?</label>
      <select id="ctype" required>
        <option value="discoloration">Colour has changed</option>
        <option value="smell">Bad smell</option>
        <option value="taste">Strange taste</option>
        <option value="sediment">Dirt or particles</option>
        <option value="illness">People feel unwell after drinking</option>
        <option value="other">Something else</option>
      </select>
      <label for="source">Which water source? (optional)</label>
      <select id="source"><option value="">I don't know / not listed</option></select>
      <label for="desc">Details (optional)</label>
      <textarea id="desc" rows="3" maxlength="1000"></textarea>
      <label for="photo">Photo (optional, JPEG or PNG, up to 10 MB)</label>
      <input id="photo" type="file" accept="image/jpeg,image/png" capture="environment">
      <button id="report-submit" type="submit">Send report</button>
      <p id="report-msg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="mine" class="hidden">
    <h2>My complaints</h2>
    <div id="mine-list"><p class="note">Loading…</p></div>
  </section>

  <section>
    <h2>Water sources</h2>
    <div id="map-list"><p class="note">Loading…</p></div>
    <p id="map-note" class="note"></p>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("js_token");
let mode = "in";

async function api(path, opts = {}) {
  const headers = { Accept: "application/json" };
  if (opts.body) headers["Content-Type"] = "application/json";
  if (token) headers.Authorization = "Bearer " + token;
  let res;
  try {
    res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  } catch {
    return { ok: false, detail: "Cannot reach the server. Check your connection." };
  }
  let json = null;
  try { json = await res.json(); } catch { /* non-JSON error page */ }
  if (res.status === 401 && token) signOut();
  return { ok: res.ok, status: res.status, json, detail: (json && json.detail) || "Something went wrong (" + res.status + ")." };
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function setMode(next) {
  mode = next;
  $("tab-in").classList.toggle("on", next === "in");
  $("tab-up").classList.toggle("on", next === "up");
  $("up-only").classList.toggle("hidden", next !== "up");
  $("pw-hint").classList.toggle("hidden", next !== "up");
  $("password").autocomplete = next === "up" ? "new-password" : "current-password";
  $("auth-submit").textContent = next === "up" ? "Create account" : "Sign in";
  $("auth-msg").textContent = "";
}

function signOut() {
  token = null;
  sessionStorage.removeItem("js_token");
  render();
}

function render() {
  const inside = !!token;
  $("auth").classList.toggle("hidden", inside);
  $("report").classList.toggle("hidden", !inside);
  $("mine").classList.toggle("hidden", !inside);
  if (inside) { loadMe(); loadMine(); }
}

async function loadMe() {
  const r = await api("/v1/public/me");
  if (r.ok) $("who").textContent = "Signed in as " + (r.json.full_name || r.json.email);
}

async function loadMine() {
  const list = $("mine-list");
  const r = await api("/v1/public/complaints");
  list.replaceChildren();
  if (!r.ok) { list.append(el("p", r.detail, "msg err")); return; }
  if (!r.json.items.length) { list.append(el("p", "You have not sent any reports yet.", "note")); return; }
  for (const c of r.json.items) {
    const item = el("div", null, "item");
    const head = el("div");
    head.append(el("strong", c.reference_number + "  "), el("span", c.status_label, "pill" + (c.status === "new" ? " new" : "")));
    item.append(head);
    item.append(el("div", c.complaint_type + (c.source_name ? " · " + c.source_name : "") + " · " + new Date(c.submitted_at).toLocaleString(), "note"));
    if (c.resolution_label) item.append(el("div", c.resolution_label, "note"));
    if (c.description) item.append(el("div", c.description));
    list.append(item);
  }
}

async function loadMap() {
  const r = await api("/v1/public/map");
  const list = $("map-list");
  list.replaceChildren();
  if (!r.ok) { list.append(el("p", r.detail, "msg err")); return; }
  for (const s of r.json.items) {
    const item = el("div", null, "item");
    item.append(el("strong", s.name + "  "), el("span", s.status_label, "pill"));
    item.append(el("div", s.source_type.replace("_", " ") + " · location " + s.location_precision, "note"));
    list.append(item);
    $("source").append(new Option(s.name, s.source_id));
  }
  $("map-note").textContent = r.json.disclaimer;
}

function readPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!["image/jpeg", "image/png"].includes(file.type)) return reject(new Error("Choose a JPEG or PNG photo."));
    if (file.size > 10 * 1024 * 1024) return reject(new Error("The photo is larger than 10 MB."));
    const reader = new FileReader();
    reader.onload = () => resolve({ content_type: file.type, data_base64: String(reader.result).split(",")[1] });
    reader.onerror = () => reject(new Error("The photo could not be read."));
    reader.readAsDataURL(file);
  });
}

$("tab-in").onclick = () => setMode("in");
$("tab-up").onclick = () => setMode("up");
$("sign-out").onclick = signOut;

$("form-auth").onsubmit = async (e) => {
  e.preventDefault();
  const btn = $("auth-submit");
  btn.disabled = true;
  $("auth-msg").className = "msg";
  $("auth-msg").textContent = "Please wait…";
  const body = { email: $("email").value.trim(), password: $("password").value };
  let r;
  if (mode === "up") {
    if ($("name").value.trim()) body.full_name = $("name").value.trim();
    if ($("phone").value.trim()) body.phone = $("phone").value.trim();
    r = await api("/v1/public/accounts", { method: "POST", body });
  } else {
    r = await api("/v1/auth/login", { method: "POST", body });
  }
  btn.disabled = false;
  if (!r.ok) { $("auth-msg").className = "msg err"; $("auth-msg").textContent = r.detail; return; }
  if (r.json.role !== "resident") {
    $("auth-msg").className = "msg err";
    $("auth-msg").textContent = "This is a staff account. Staff use the JalSakshi app.";
    return;
  }
  token = r.json.token;
  sessionStorage.setItem("js_token", token);
  $("password").value = "";
  $("auth-msg").textContent = "";
  render();
};

$("form-report").onsubmit = async (e) => {
  e.preventDefault();
  const msg = $("report-msg");
  const btn = $("report-submit");
  msg.className = "msg";
  const body = { complaint_type: $("ctype").value };
  if ($("source").value) body.source_id = $("source").value;
  if ($("desc").value.trim()) body.description = $("desc").value.trim();
  try {
    if ($("photo").files[0]) body.photo = await readPhoto($("photo").files[0]);
  } catch (err) {
    msg.className = "msg err"; msg.textContent = err.message; return;
  }
  btn.disabled = true;
  msg.textContent = "Sending…";
  const r = await api("/v1/public/complaints", { method: "POST", body });
  btn.disabled = false;
  if (!r.ok) { msg.className = "msg err"; msg.textContent = r.detail; return; }
  msg.textContent = "Sent. Reference " + r.json.reference_number + ". " + r.json.notice;
  $("form-report").reset();
  loadMine();
};

setMode("in");
render();
loadMap();
</script>
</body>
</html>
