# render.yaml - Render Blueprint for the JalSakshi API.
# Step-by-step setup (Supabase Auth, database, first users): docs/deploy-render.md
#
# What this deploys: STAGING with SYNTHETIC data. Sign-in is real (Supabase
# Auth, verified against Supabase's published signing keys) and data lives in
# your Supabase Postgres, but everything captured is SYN-COLOR-001 synthetic
# test data. `production` is reserved for a real kit: config.py refuses
# production with synthetic data.

services:
  - type: web
    name: jalsakshi-api
    runtime: docker

    # The build context is the REPOSITORY ROOT so the image can include
    # protocols/, which the case engine reads. The root .dockerignore admits
    # only services/api/ and protocols/.
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile

    plan: free          # sleeps after 15 min idle (first request then takes ~1 min); `starter` stays up
    region: singapore   # closest to the Supabase project (ap-northeast-1)
    branch: main        # merge the working branch into main before deploying
    healthCheckPath: /health/live

    envVars:
      - key: JALSAKSHI_ENVIRONMENT
        value: staging
      - key: JALSAKSHI_TENANT_DATA_MODE
        value: synthetic
      # Supabase access tokens carry aud = "authenticated".
      - key: JALSAKSHI_OIDC_AUDIENCE
        value: authenticated

      # Set in the dashboard when Render asks (sync: false = never in git):
      # https://<project-ref>.supabase.co/auth/v1
      - key: JALSAKSHI_OIDC_ISSUER
        sync: false
      # Supabase -> Connect -> Session pooler, with ?sslmode=require
      - key: JALSAKSHI_DATABASE_URL
        sync: false
      # Origin of the supervisor board, if any (comma-separated, exact). Empty = none.
      - key: JALSAKSHI_CORS_ALLOWED_ORIGINS
        sync: false
